<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schools — EduMap Tanzania</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <path d="M13 2C7.5 2 3 6.5 3 12c0 8 10 14 10 14s10-6 10-14c0-5.5-4.5-10-10-10z" fill="#D64550"/>
          <circle cx="13" cy="12" r="4.5" fill="#fff"/>
        </svg>
        <span class="brand-name">EduMap<span class="brand-sub">Tanzania</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="map.html">Map</a></li>
        <li><a href="schools.html" aria-current="page">Schools</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </div>
  </header>

  <section class="page-body">
    <div class="wrap">
      <div class="section-title"><span class="pin-dot"></span><h2>Browse schools</h2></div>

      <!-- FILTER BAR
           All controls are plain form elements. JS reads their
           current values and re-renders the list — no page
           reload needed. -->
      <div class="filter-bar">
        <div>
          <label for="search">Search by name</label>
          <input type="text" id="search" placeholder="e.g. Mwenge...">
        </div>
        <div>
          <label for="region-filter">Region</label>
          <select id="region-filter"><option value="">All regions</option></select>
        </div>
        <div>
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="critical">Critical need</option>
            <option value="moderate">Moderate need</option>
            <option value="stable">Stable</option>
          </select>
        </div>
        <div>
          <label for="sort-by">Sort by</label>
          <select id="sort-by">
            <option value="name">Name (A–Z)</option>
            <option value="urgency">Most urgent first</option>
            <option value="students">Most students first</option>
          </select>
        </div>
        <div class="filter-legend">
          <span><span class="status-dot" style="background:#D64550;"></span>Critical</span>
          <span><span class="status-dot" style="background:#E8A33D;"></span>Moderate</span>
          <span><span class="status-dot" style="background:#3FA796;"></span>Stable</span>
        </div>
      </div>

      <p id="result-count" style="color:var(--ink-soft); font-size:14px; margin-top:-10px;"></p>

      <!-- School cards are injected here by JS -->
      <div class="grid-3" id="school-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="site.js"></script>
  <script>
    let ALL_SCHOOLS = [];
    const STATUS_RANK = { critical: 0, moderate: 1, stable: 2 };

    // Builds one school card's HTML. Kept as its own function so
    // render() (below) can just map over an array and join.
    function schoolCardHTML(school) {
      const meta = statusMeta(school.status);
      return `
        <div class="card card-pad school-card" style="border-left-color:${meta.color};">
          <span class="status-badge" style="color:${meta.color};">
            <span class="status-dot" style="background:${meta.color};"></span>${meta.label}
          </span>
          <h3>${school.name}</h3>
          <div class="region">${school.region}</div>
          <div class="metrics">
            <span>${ratio(school.students, school.teachers)} ratio</span>
            <span>${school.students} students</span>
          </div>
          <a class="view-link" href="school_details.html?id=${school.id}">View full profile →</a>
        </div>`;
    }

    // Re-draws the grid based on the current filter/search/sort values.
    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const region = document.getElementById('region-filter').value;
      const status = document.getElementById('status-filter').value;
      const sortBy = document.getElementById('sort-by').value;

      let filtered = ALL_SCHOOLS.filter(s => {
        const matchesQ = !q || s.name.toLowerCase().includes(q);
        const matchesRegion = !region || s.region === region;
        const matchesStatus = !status || s.status === status;
        return matchesQ && matchesRegion && matchesStatus;
      });

      if (sortBy === 'urgency') {
        filtered = filtered.slice().sort((a, b) => STATUS_RANK[a.status] - STATUS_RANK[b.status]);
      } else if (sortBy === 'students') {
        filtered = filtered.slice().sort((a, b) => b.students - a.students);
      } else {
        filtered = filtered.slice().sort((a, b) => a.name.localeCompare(b.name));
      }

      document.getElementById('school-grid').innerHTML =
        filtered.length ? filtered.map(schoolCardHTML).join('')
                        : `<p style="color:var(--ink-soft);">No schools match those filters.</p>`;
      document.getElementById('result-count').textContent =
        `Showing ${filtered.length} of ${ALL_SCHOOLS.length} schools`;
    }

    (async function init() {
      ALL_SCHOOLS = await getSchools();

      // Populate the region dropdown dynamically from whatever
      // regions actually exist in the data (so Admin-added
      // schools in a new region show up automatically).
      const regionSelect = document.getElementById('region-filter');
      [...new Set(ALL_SCHOOLS.map(s => s.region))].sort().forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        regionSelect.appendChild(opt);
      });

      // Re-render whenever any control changes.
      document.getElementById('search').addEventListener('input', render);
      regionSelect.addEventListener('change', render);
      document.getElementById('status-filter').addEventListener('change', render);
      document.getElementById('sort-by').addEventListener('change', render);

      render();
    })();
  </script>
  <!-- COMPACT FOOTER -->
  <footer class="site-footer-compact">
    <div class="wrap">
      <div class="footer-compact-content">
        <a class="footer-brand-compact" href="index.html">EduMap<span>Tanzania</span></a>
        <span class="footer-tagline-compact">Every school counted. Every need known.</span>
        <span class="footer-copy-compact">&copy; 2026 EduMap Tanzania.</span>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="site.js"></script>
  <script>
    let ALL_SCHOOLS = [];
    // ... (keep your existing schools script exactly as it is) ...
  </script>
</body>
</html>
